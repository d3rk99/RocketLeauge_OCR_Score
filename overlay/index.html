<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rocket League Score Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="overlay-frame">
    <div class="team team-a">
      <div id="teamAName" class="name">Team Alpha</div>
      <div id="teamAScore" class="score">0</div>
      <div id="teamAGames" class="games">Games: 0</div>
    </div>

    <div class="center-info">
      <div id="seriesText" class="series">Best of 5</div>
      <div id="statusText" class="status">IDLE</div>
    </div>

    <div class="team team-b">
      <div id="teamBName" class="name">Team Bravo</div>
      <div id="teamBScore" class="score">0</div>
      <div id="teamBGames" class="games">Games: 0</div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
